<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interpolación de Lagrange Pro</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body {
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            min-height: 100vh;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .glass-card {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }
        .btn-gradient {
            background: linear-gradient(to right, #4f46e5, #3b82f6);
            transition: all 0.3s ease;
        }
        .btn-gradient:hover {
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(59, 130, 246, 0.4);
        }
        .radio-player {
            position: fixed;
            bottom: 20px;
            right: 20px;
            z-index: 1000;
            display: flex;
            align-items: center;
            background: #111827;
            padding: 10px 18px;
            border-radius: 50px;
            border: 2px solid #3b82f6;
        }
        .pulse { animation: pulse-animation 2s infinite; }
        @keyframes pulse-animation {
            0% { box-shadow: 0 0 0 0px rgba(59, 130, 246, 0.7); }
            100% { box-shadow: 0 0 0 15px rgba(59, 130, 246, 0); }
        }
    </style>
</head>
<body class="p-4 md:p-8">

    <div class="max-w-6xl mx-auto">
        <header class="text-center mb-8">
            <h1 class="text-4xl font-black text-gray-800 tracking-tight">Lagrange <span class="text-blue-600">Interpolator</span></h1>
            <p class="text-gray-500">Añade tus puntos y calcula el polinomio instantáneamente</p>
        </header>

        <div class="grid grid-cols-1 lg:grid-cols-12 gap-6">
            
            <div class="lg:col-span-4 space-y-6">
                
                <div class="glass-card p-6 rounded-2xl shadow-xl">
                    <h2 class="text-lg font-bold mb-4 flex items-center">
                        <span class="bg-blue-100 text-blue-600 p-2 rounded-lg mr-2">1</span> 
                        Entrada de Datos
                    </h2>
                    <div class="grid grid-cols-2 gap-3 mb-4">
                        <div>
                            <label class="block text-xs font-bold text-gray-500 uppercase">Punto X</label>
                            <input type="number" id="newX" step="any" class="w-full p-2 border rounded-lg outline-none focus:border-blue-500" placeholder="0">
                        </div>
                        <div>
                            <label class="block text-xs font-bold text-gray-500 uppercase">Punto Y</label>
                            <input type="number" id="newY" step="any" class="w-full p-2 border rounded-lg outline-none focus:border-blue-500" placeholder="0">
                        </div>
                    </div>
                    <button onclick="addPoint()" class="w-full bg-gray-800 text-white py-2 rounded-lg hover:bg-black transition-colors font-medium">
                        + Agregar Punto
                    </button>
                    
                    <div class="mt-6">
                        <label class="block text-xs font-bold text-gray-500 uppercase mb-2">Puntos Actuales</label>
                        <div id="pointsList" class="max-h-40 overflow-y-auto space-y-2 pr-2">
                            </div>
                    </div>
                </div>

                <div class="glass-card p-6 rounded-2xl shadow-xl">
                    <h2 class="text-lg font-bold mb-4 flex items-center">
                        <span class="bg-green-100 text-green-600 p-2 rounded-lg mr-2">2</span> 
                        Interpolar
                    </h2>
                    <input type="number" id="targetX" placeholder="Valor X a calcular..." 
                           class="w-full p-3 border border-gray-300 rounded-lg mb-4 outline-none focus:ring-2 focus:ring-blue-400">
                    <button onclick="calculate()" class="w-full btn-gradient text-white font-bold py-3 rounded-lg">
                        Calcular Resultado
                    </button>
                </div>

                <div id="resultContainer"></div>
            </div>

            <div class="lg:col-span-8">
                <div class="glass-card p-6 rounded-2xl shadow-xl h-[500px] flex flex-col">
                    <h2 class="text-lg font-bold mb-4 text-gray-700">Visualización del Polinomio</h2>
                    <div class="flex-grow relative">
                        <canvas id="chartCanvas"></canvas>
                    </div>
                </div>
            </div>

        </div>
    </div>

    <div class="radio-player shadow-2xl">
        <div class="mr-4">
            <p class="text-[10px] font-bold uppercase text-blue-400">Radio On</p>
            <p class="text-[9px] text-gray-400">Zeno FM</p>
        </div>
        <audio id="radioAudio" src="http://stream.zeno.fm/0k6va3rg8rhvv"></audio>
        <button onclick="toggleRadio()" id="radioBtn" class="bg-blue-600 p-2 rounded-full">
            <svg id="playIcon" xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14.752 11.168l-3.197-2.132A1 1 0 0010 9.87v4.263a1 1 0 001.555.832l3.197-2.132a1 1 0 000-1.664z" />
            </svg>
        </button>
    </div>

<script>
    let myChart = null;
    let points = [];

    // --- GESTIÓN DE PUNTOS ---
    function renderPoints() {
        const container = document.getElementById('pointsList');
        container.innerHTML = points.length === 0 ? '<p class="text-gray-400 text-sm italic">No hay puntos definidos</p>' : '';
        
        points.forEach((p, index) => {
            const div = document.createElement('div');
            div.className = "flex justify-between items-center bg-white p-2 rounded border text-sm shadow-sm";
            div.innerHTML = `
                <span><strong>P${index}:</strong> (${p.x}, ${p.y})</span>
                <button onclick="removePoint(${index})" class="text-red-500 hover:text-red-700 font-bold">×</button>
            `;
            container.appendChild(div);
        });
        updateChart();
    }

    function addPoint() {
        const x = parseFloat(document.getElementById('newX').value);
        const y = parseFloat(document.getElementById('newY').value);
        
        if (!isNaN(x) && !isNaN(y)) {
            points.push({x, y});
            // Ordenar por X para que la gráfica no se rompa
            points.sort((a, b) => a.x - b.x);
            document.getElementById('newX').value = '';
            document.getElementById('newY').value = '';
            renderPoints();
        }
    }

    function removePoint(index) {
        points.splice(index, 1);
        renderPoints();
    }

    // --- LÓGICA DE LAGRANGE ---
    function calculateLagrange(x, pts) {
        let result = 0;
        for (let i = 0; i < pts.length; i++) {
            let term = pts[i].y;
            for (let j = 0; j < pts.length; j++) {
                if (i !== j) {
                    term *= (x - pts[j].x) / (pts[i].x - pts[j].x);
                }
            }
            result += term;
        }
        return result;
    }

    function calculate() {
        const targetX = parseFloat(document.getElementById('targetX').value);
        const resultDiv = document.getElementById('resultContainer');

        if (points.length < 2) {
            alert("Se requieren al menos 2 puntos.");
            return;
        }
        if (isNaN(targetX)) return;

        const resultY = calculateLagrange(targetX, points);
        resultDiv.innerHTML = `
            <div class="bg-blue-600 text-white p-5 rounded-2xl shadow-lg text-center mt-4">
                <p class="text-xs opacity-80 uppercase tracking-widest">Resultado P(${targetX})</p>
                <p class="text-4xl font-bold">${resultY.toFixed(4)}</p>
            </div>
        `;
        updateChart(targetX, resultY);
    }

    // --- GRÁFICA ---
    function updateChart(interpolatedX = null, interpolatedY = null) {
        const ctx = document.getElementById('chartCanvas').getContext('2d');
        if (myChart) myChart.destroy();

        const datasets = [{
            label: 'Puntos Datos',
            data: points,
            backgroundColor: '#3b82f6',
            pointRadius: 6,
            showLine: false
        }];

        if (points.length >= 2) {
            const curve = [];
            const xs = points.map(p => p.x);
            const min = Math.min(...xs) - 1;
            const max = Math.max(...xs) + 1;
            
            for (let i = 0; i <= 100; i++) {
                const cx = min + (i * (max - min) / 100);
                curve.push({ x: cx, y: calculateLagrange(cx, points) });
            }
            datasets.push({
                label: 'Polinomio',
                data: curve,
                borderColor: '#4f46e5',
                borderWidth: 2,
                pointRadius: 0,
                fill: false,
                type: 'line',
                tension: 0.4
            });
        }

        if (interpolatedX !== null) {
            datasets.push({
                label: 'Resultado',
                data: [{x: interpolatedX, y: interpolatedY}],
                backgroundColor: '#ef4444',
                pointRadius: 10,
                pointStyle: 'star'
            });
        }

        myChart = new Chart(ctx, {
            type: 'scatter',
            data: { datasets },
            options: { 
                responsive: true, 
                maintainAspectRatio: false,
                scales: {
                    x: { grid: { color: '#e5e7eb' } },
                    y: { grid: { color: '#e5e7eb' } }
                }
            }
        });
    }

    // --- RADIO ---
    function toggleRadio() {
        const audio = document.getElementById('radioAudio');
        const icon = document.getElementById('playIcon');
        const btn = document.getElementById('radioBtn');

        if (audio.paused) {
            audio.play();
            btn.classList.add('pulse');
            icon.innerHTML = '<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 9v6m4-6v6m7-3a9 9 0 11-18 0 9 9 0 0118 0z" />';
        } else {
            audio.pause();
            btn.classList.remove('pulse');
            icon.innerHTML = '<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14.752 11.168l-3.197-2.132A1 1 0 0010 9.87v4.263a1 1 0 001.555.832l3.197-2.132a1 1 0 000-1.664z" />';
        }
    }

    renderPoints();
</script>
</body>
</html>
