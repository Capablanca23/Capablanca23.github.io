<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interpolación de Lagrange Pro</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        /* CSS Adicional para mejorar el atractivo */
        body {
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            min-height: 100vh;
        }
        .glass-card {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            transition: transform 0.3s ease;
        }
        .btn-gradient {
            background: linear-gradient(to right, #4f46e5, #3b82f6);
            transition: all 0.3s ease;
        }
        .btn-gradient:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 15px rgba(59, 130, 246, 0.4);
        }
        /* Estilos para el Widget de Radio */
        .radio-player {
            position: fixed;
            bottom: 20px;
            right: 20px;
            z-index: 1000;
            display: flex;
            align-items: center;
            background: #1f2937;
            padding: 10px 20px;
            border-radius: 50px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
            color: white;
            border: 2px solid #3b82f6;
        }
        .pulse {
            animation: pulse-animation 2s infinite;
        }
        @keyframes pulse-animation {
            0% { box-shadow: 0 0 0 0px rgba(59, 130, 246, 0.7); }
            100% { box-shadow: 0 0 0 15px rgba(59, 130, 246, 0); }
        }
    </style>
</head>
<body class="p-4 md:p-8">

    <div class="max-w-5xl mx-auto">
        <header class="text-center mb-10">
            <h1 class="text-4xl font-extrabold text-gray-800 mb-2">Interpolador de Lagrange</h1>
            <p class="text-gray-600 italic">Cálculo numérico con estilo</p>
        </header>

        <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
            <div class="lg:col-span-1 space-y-6">
                <div class="glass-card p-6 rounded-2xl shadow-xl">
                    <h2 class="text-xl font-bold mb-4 text-blue-600">Configuración</h2>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Valor X a evaluar:</label>
                    <input type="number" id="targetX" placeholder="Ej: 2.5" 
                           class="w-full p-3 border border-gray-300 rounded-lg mb-4 focus:ring-2 focus:ring-blue-500 outline-none">
                    
                    <button onclick="calculate()" class="w-full btn-gradient text-white font-bold py-3 rounded-lg shadow-md">
                        Calcular Ahora
                    </button>
                </div>

                <div id="resultContainer">
                    </div>
            </div>

            <div class="lg:col-span-2">
                <div class="glass-card p-6 rounded-2xl shadow-xl h-full">
                    <canvas id="chartCanvas"></canvas>
                </div>
            </div>
        </div>
    </div>

    <div class="radio-player shadow-2xl">
        <div class="mr-3">
            <span class="flex h-3 w-3 relative">
                <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-blue-400 opacity-75"></span>
                <span class="relative inline-flex rounded-full h-3 w-3 bg-blue-500"></span>
            </span>
        </div>
        <div class="mr-4">
            <p class="text-xs font-bold uppercase tracking-widest text-blue-400">En Vivo</p>
            <p class="text-[10px] text-gray-300">Zeno FM Radio</p>
        </div>
        <audio id="radioAudio" src="http://stream.zeno.fm/0k6va3rg8rhvv"></audio>
        <button onclick="toggleRadio()" id="radioBtn" class="bg-blue-600 hover:bg-blue-700 p-2 rounded-full transition-colors">
            <svg id="playIcon" xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14.752 11.168l-3.197-2.132A1 1 0 0010 9.87v4.263a1 1 0 001.555.832l3.197-2.132a1 1 0 000-1.664z" />
            </svg>
        </button>
    </div>

<script>
    // Variables Globales
    let myChart = null;
    let points = [{x: 0, y: 0}, {x: 1, y: 1}, {x: 2, y: 4}, {x: 3, y: 9}]; // Puntos de ejemplo

    // Lógica de Radio
    function toggleRadio() {
        const audio = document.getElementById('radioAudio');
        const playIcon = document.getElementById('playIcon');
        const radioBtn = document.getElementById('radioBtn');

        if (audio.paused) {
            audio.play();
            radioBtn.classList.add('pulse');
            playIcon.innerHTML = '<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 9v6m4-6v6m7-3a9 9 0 11-18 0 9 9 0 0118 0z" />';
        } else {
            audio.pause();
            radioBtn.classList.remove('pulse');
            playIcon.innerHTML = '<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14.752 11.168l-3.197-2.132A1 1 0 0010 9.87v4.263a1 1 0 001.555.832l3.197-2.132a1 1 0 000-1.664z" />';
        }
    }

    // Algoritmo de Lagrange
    function calculateLagrange(x, pts) {
        let result = 0;
        const n = pts.length;
        for (let i = 0; i < n; i++) {
            let term = pts[i].y;
            for (let j = 0; j < n; j++) {
                if (i !== j) {
                    term *= (x - pts[j].x) / (pts[i].x - pts[j].x);
                }
            }
            result += term;
        }
        return result;
    }

    // CÁLCULO E INTERFAZ
    function calculate() {
        const targetInput = document.getElementById('targetX');
        const valX = parseFloat(targetInput.value);
        const resultDiv = document.getElementById('resultContainer');

        if (isNaN(valX)) {
            resultDiv.innerHTML = `
                <div class="bg-red-100 border-l-4 border-red-500 text-red-700 p-4 rounded shadow-sm">
                    <p>Ingrese un valor X válido.</p>
                </div>`;
            return;
        }

        try {
            const resultY = calculateLagrange(valX, points);
            resultDiv.innerHTML = `
                <div class="bg-white border-l-4 border-blue-500 text-gray-800 p-6 rounded-xl shadow-lg text-center animate-bounce-short">
                    <p class="text-sm font-medium text-blue-500 mb-1">Resultado para x = ${valX}</p>
                    <p class="text-4xl font-extrabold">${resultY.toFixed(4)}</p>
                    <p class="text-xs text-gray-400 mt-2">Interpolación exitosa</p>
                </div>
            `;
            updateChart(valX, resultY);
        } catch (e) {
            resultDiv.innerHTML = `<p class="text-red-500">Error en el cálculo.</p>`;
        }
    }

    // GRÁFICOS (Chart.js mejorado)
    function updateChart(interpolatedX = null, interpolatedY = null) {
        const ctx = document.getElementById('chartCanvas').getContext('2d');
        const curvePoints = [];
        const minX = Math.min(...points.map(p => p.x)) - 1;
        const maxX = Math.max(...points.map(p => p.x)) + 1;
        
        for (let i = 0; i <= 50; i++) {
            const cx = minX + (i * (maxX - minX)) / 50;
            curvePoints.push({ x: cx, y: calculateLagrange(cx, points) });
        }

        const datasets = [
            {
                label: 'Curva Lagrange',
                data: curvePoints,
                borderColor: '#4f46e5',
                borderWidth: 3,
                pointRadius: 0,
                fill: false,
                type: 'line',
                tension: 0.4
            },
            {
                label: 'Puntos Originales',
                data: points,
                backgroundColor: '#3b82f6',
                pointRadius: 6
            }
        ];

        if (interpolatedX !== null) {
            datasets.push({
                label: 'Punto Hallado',
                data: [{x: interpolatedX, y: interpolatedY}],
                backgroundColor: '#ef4444',
                pointRadius: 10,
                pointStyle: 'rectRot'
            });
        }

        if (myChart) myChart.destroy();
        myChart = new Chart(ctx, {
            type: 'scatter',
            data: { datasets },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                plugins: { legend: { labels: { usePointStyle: true } } }
            }
        });
    }

    // Inicializar gráfica
    window.onload = () => updateChart();
</script>
</body>
</html>
