<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Limpiar caché · Constructor de moléculas</title>
<style>
:root{--bg:#f2f5fa;--card:#fff;--tx:#101B35;--mut:#5a6685;--bd:#d9e1ef;--b:#1769FF;--g:#16A36A;--r:#e5484d}
@media(prefers-color-scheme:dark){:root{--bg:#0a1127;--card:#131f3d;--tx:#e8eefc;--mut:#9aa7c7;--bd:#26365f}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
 padding:max(16px,env(safe-area-inset-top)) 16px max(16px,env(safe-area-inset-bottom))}
main{max-width:520px;margin:0 auto}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:16px;margin-bottom:12px}
h1{font:800 1.3rem Georgia,serif;margin:0 0 6px}
p{margin:6px 0}.mut{color:var(--mut);font-size:.9rem}
button{width:100%;min-height:52px;border:0;border-radius:12px;background:var(--b);color:#fff;font:700 1.05rem inherit;cursor:pointer;margin-top:8px}
button:disabled{opacity:.6}
#log{font:.85rem/1.5 ui-monospace,Menlo,monospace;white-space:pre-wrap;word-break:break-word;margin:0}
.ok{color:var(--g)}.err{color:var(--r)}
</style>
</head>
<body>
<main>
 <div class="card">
  <h1>🧹 Limpiar caché</h1>
  <p>Borra el service worker, las cachés y los datos guardados de esta app en este dispositivo, y luego abre la versión más reciente.</p>
  <p class="mut">Súbelo a la misma carpeta que <b>index.html</b> (mismo sitio de GitHub Pages).</p>
  <button id="go" type="button">Borrar caché y abrir la app</button>
 </div>
 <div class="card"><pre id="log">Esperando…</pre></div>
</main>
<script>
(function(){
 const log=document.getElementById('log'),btn=document.getElementById('go');
 const say=(t,c)=>{const s=document.createElement('span');if(c)s.className=c;s.textContent=t+'\n';if(log.textContent==='Esperando…')log.textContent='';log.appendChild(s)};
 const sleep=ms=>new Promise(r=>setTimeout(r,ms));

 async function limpiar(){
  btn.disabled=true;log.textContent='';
  try{
   if('serviceWorker' in navigator){
    const regs=await navigator.serviceWorker.getRegistrations();
    for(const r of regs){await r.unregister()}
    say('✓ Service workers eliminados: '+regs.length,'ok');
   }else say('· Este navegador no usa service workers');
  }catch(e){say('✗ Service workers: '+e.message,'err')}

  try{
   if('caches' in window){
    const keys=await caches.keys();
    for(const k of keys){await caches.delete(k)}
    say('✓ Cachés eliminadas: '+keys.length+(keys.length?' ('+keys.join(', ')+')':''),'ok');
   }
  }catch(e){say('✗ Cachés: '+e.message,'err')}

  try{localStorage.clear();sessionStorage.clear();say('✓ localStorage y sessionStorage limpios','ok')}
  catch(e){say('✗ Almacenamiento: '+e.message,'err')}

  try{
   if(indexedDB&&indexedDB.databases){
    const dbs=await indexedDB.databases();
    for(const d of dbs){if(d.name)indexedDB.deleteDatabase(d.name)}
    say('✓ IndexedDB eliminadas: '+dbs.length,'ok');
   }
  }catch(e){say('· IndexedDB: '+e.message)}

  say('\nAbriendo la versión nueva…');
  await sleep(1200);
  /* parámetro único para saltarse cualquier caché HTTP restante */
  location.replace('./index.html?v='+Date.now());
 }
 btn.addEventListener('click',limpiar);
})();
</script>
</body>
</html>
