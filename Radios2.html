<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Radio Pro - Illuminated Edition & Playlist</title>
    <style>
        :root {
            --neon-green: #00ff88;
            --neon-blue: #0066ff;
            --bg-dark: #020b13;
            --surface: rgba(10, 25, 41, 0.85);
            --text: #e2e8f0;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-dark);
            background-image: 
                radial-gradient(circle at 20% 30%, rgba(0, 102, 255, 0.15) 0%, transparent 40%),
                radial-gradient(circle at 80% 70%, rgba(0, 255, 136, 0.15) 0%, transparent 40%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text);
            overflow: hidden;
            padding: 20px;
        }

        /* Contenedor Principal Adaptable */
        .main-container {
            display: flex;
            gap: 25px;
            width: 100%;
            max-width: 850px;
            align-items: stretch;
            transition: all 0.4s ease;
        }

        /* Tarjeta del Reproductor */
        .player-card {
            background: var(--surface);
            backdrop-filter: blur(15px);
            flex: 1;
            min-width: 320px;
            max-width: 450px;
            padding: 35px;
            border-radius: 30px;
            border: 1px solid rgba(0, 255, 136, 0.2);
            box-shadow: 0 0 50px rgba(0, 0, 0, 0.6), inset 0 0 20px rgba(0, 102, 255, 0.1);
            text-align: center;
            position: relative;
            z-index: 2;
        }

        /* Panel del Listado (Playlist) */
        .playlist-card {
            background: rgba(5, 15, 28, 0.95);
            backdrop-filter: blur(15px);
            width: 350px;
            border-radius: 30px;
            border: 1px solid rgba(0, 102, 255, 0.3);
            box-shadow: 0 0 40px rgba(0, 102, 255, 0.15);
            padding: 25px;
            display: flex;
            flex-direction: column;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            max-height: 560px;
        }

        .playlist-header {
            font-size: 1.1rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: var(--neon-blue);
            margin-bottom: 15px;
            padding-bottom: 10px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            text-align: left;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .playlist-header span {
            color: var(--neon-green);
            font-size: 0.8rem;
        }

        .station-list {
            list-style: none;
            overflow-y: auto;
            flex: 1;
            padding-right: 5px;
        }

        /* Scrollbar Personalizado */
        .station-list::-webkit-scrollbar { width: 5px; }
        .station-list::-webkit-scrollbar-track { background: transparent; }
        .station-list::-webkit-scrollbar-thumb { background: rgba(0, 102, 255, 0.3); border-radius: 10px; }
        .station-list::-webkit-scrollbar-thumb:hover { background: var(--neon-blue); }

        .station-item {
            padding: 12px 15px;
            background: rgba(255, 255, 255, 0.02);
            border-radius: 12px;
            margin-bottom: 8px;
            cursor: pointer;
            text-align: left;
            font-size: 0.9rem;
            transition: all 0.2s ease;
            border: 1px solid transparent;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .station-item:hover {
            background: rgba(0, 255, 136, 0.05);
            border-color: rgba(0, 255, 136, 0.2);
            transform: translateX(3px);
        }

        .station-item.active-track {
            background: linear-gradient(90deg, rgba(0, 102, 255, 0.2), transparent);
            border-color: var(--neon-blue);
            color: #fff;
            font-weight: bold;
            box-shadow: 0 0 10px rgba(0, 102, 255, 0.1);
        }

        /* Títulos e Info */
        .header h2 {
            font-size: 1.2rem;
            text-transform: uppercase;
            letter-spacing: 3px;
            color: var(--neon-green);
            text-shadow: 0 0 10px rgba(0, 255, 136, 0.4);
        }

        .author-box {
            margin: 8px 0 20px;
            font-size: 0.75rem;
            color: #8892b0;
            line-height: 1.4;
        }

        .author-box b { color: var(--neon-blue); }

        .display-station {
            height: 70px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            margin-bottom: 15px;
        }

        #current-station-name {
            font-size: 1.3rem;
            font-weight: bold;
            color: #fff;
            margin-bottom: 4px;
        }

        #current-genre-label {
            font-size: 0.75rem;
            color: var(--neon-blue);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        /* Visualizador Pro */
        .visualizer-pro {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 3px;
            height: 90px;
            margin-bottom: 25px;
        }

        .v-bar {
            width: 5px;
            height: 12px;
            background: linear-gradient(to top, var(--neon-blue), var(--neon-green));
            border-radius: 10px;
            transition: 0.3s;
        }

        .playing .v-bar {
            animation: wave 1.2s ease-in-out infinite;
        }

        @keyframes wave {
            0%, 100% { height: 12px; opacity: 0.4; }
            50% { height: 75px; opacity: 1; filter: brightness(1.2); }
        }

        /* Tabs */
        .tabs {
            display: flex;
            background: rgba(0,0,0,0.4);
            border-radius: 15px;
            padding: 5px;
            margin-bottom: 20px;
        }

        .tab {
            flex: 1;
            padding: 10px;
            border: none;
            background: transparent;
            color: var(--text);
            cursor: pointer;
            border-radius: 10px;
            font-weight: bold;
            transition: 0.3s;
            font-size: 0.85rem;
        }

        .tab.active {
            background: var(--neon-blue);
            box-shadow: 0 0 15px rgba(0, 102, 255, 0.6);
            color: #fff;
        }

        /* Controles */
        .main-controls {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 25px;
        }

        .circle-btn {
            background: rgba(255,255,255,0.03);
            border: 1px solid rgba(255,255,255,0.08);
            color: white;
            border-radius: 50%;
            cursor: pointer;
            transition: 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .btn-small { width: 45px; height: 45px; }
        .btn-med { width: 55px; height: 55px; }
        .btn-large { 
            width: 75px; 
            height: 75px; 
            background: var(--neon-green); 
            color: var(--bg-dark);
            border: none;
            box-shadow: 0 0 20px rgba(0, 255, 136, 0.4);
        }

        .circle-btn:hover {
            transform: scale(1.08);
            border-color: var(--neon-green);
            color: var(--neon-green);
        }

        .btn-large:hover {
            box-shadow: 0 0 30px rgba(0, 255, 136, 0.7);
            color: #000;
        }

        .aux-controls {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-bottom: 25px;
        }

        .aux-btn {
            background: transparent;
            border: none;
            color: #4a5568;
            cursor: pointer;
            font-size: 1.2rem;
            transition: 0.3s;
            display: flex;
            align-items: center;
        }

        .aux-btn.active { color: var(--neon-green); filter: drop-shadow(0 0 5px var(--neon-green)); }

        /* Volumen */
        .vol-wrapper {
            display: flex;
            align-items: center;
            gap: 15px;
            background: rgba(0,0,0,0.3);
            padding: 10px 20px;
            border-radius: 20px;
        }

        .vol-slider {
            flex: 1;
            -webkit-appearance: none;
            height: 4px;
            background: #1a202c;
            border-radius: 2px;
            outline: none;
        }

        .vol-slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 14px; height: 14px;
            background: var(--neon-blue);
            border-radius: 50%;
            cursor: pointer;
            box-shadow: 0 0 8px var(--neon-blue);
        }

        svg { fill: currentColor; width: 22px; height: 22px; }

        /* Diseño Responsivo Móvil */
        @media (max-width: 768px) {
            .main-container {
                flex-direction: column;
                align-items: center;
                overflow-y: auto;
                max-height: 95vh;
            }
            .playlist-card {
                width: 100%;
                max-width: 450px;
                max-height: 250px;
            }
        }
    </style>
</head>
<body>

    <div class="main-container">
        <div class="player-card">
            <div class="header">
                <h2>Digital Radio</h2>
                <div class="author-box">
                    Autor: <b>Dr. Ronald F. Rodriguez Espinoza</b><br>
                    Radios de Salsa & Hits
                </div>
            </div>

            <div class="display-station">
                <div id="current-genre-label">Salsa Mix</div>
                <div id="current-station-name">Selecciona Estación</div>
            </div>

            <div class="visualizer-pro" id="visualizer"></div>

            <div class="tabs">
                <button class="tab active" onclick="changeGenre('salsa')">Salsa</button>
                <button class="tab" onclick="changeGenre('pop')">Pop</button>
                <button class="tab" onclick="changeGenre('rock')">Rock</button>
            </div>

            <div class="aux-controls">
                <button class="aux-btn" id="shuffle-btn" onclick="toggleShuffle()" title="Aleatorio">
                    <svg viewBox="0 0 24 24"><path d="M10.59 9.17L5.41 4 4 5.41l5.17 5.17 1.42-1.41zM14.5 4l2.04 2.04L4 18.59 5.41 20 17.96 7.46 20 9.5V4h-5.5zm.33 9.41l-1.41 1.41 3.13 3.13L14.5 20H20v-5.5l-2.04 2.04-3.13-3.13z"/></svg>
                </button>
                <button class="aux-btn" id="loop-btn" onclick="toggleLoop()" title="Repetir">
                    <svg viewBox="0 0 24 24"><path d="M7 7h10v3l4-4-4-4v3H5v6h2V7zm10 10H7v-3l-4 4 4 4v-3h12v-6h-2v4z"/></svg>
                </button>
                <button class="aux-btn" id="mute-btn" onclick="toggleMute()" title="Silenciar">
                    <svg id="mute-icon" viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/></svg>
                </button>
            </div>

            <div class="main-controls">
                <button class="circle-btn btn-med" onclick="prevStation()">
                    <svg viewBox="0 0 24 24"><path d="M6 6h2v12H6zm3.5 6l8.5 6V6z"/></svg>
                </button>

                <button class="circle-btn btn-large" id="play-btn" onclick="togglePlay()">
                    <svg id="play-svg" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
                </button>

                <button class="circle-btn btn-med" onclick="nextStation()">
                    <svg viewBox="0 0 24 24"><path d="M16 6h2v12h-2zm-10.5 0v12l8.5-6z"/></svg>
                </button>
            </div>

            <div class="vol-wrapper">
                <span>🔈</span>
                <input type="range" id="volume" class="vol-slider" min="0" max="1" step="0.01" value="0.8" oninput="updateVolume()">
                <span>🔊</span>
            </div>
        </div>

        <div class="playlist-card">
            <div class="playlist-header">
                Estaciones <span id="track-count">0 disponibles</span>
            </div>
            <ul class="station-list" id="station-list-container">
                </ul>
        </div>
    </div>

    <audio id="audio-player"></audio>

    <script>
        const playlist = {
            salsa: [
                { n: "Salsa Zeno Premium", u: "https://stream.zeno.fm/jepsiojbklltv" },
                { n: "Rumba Estéreo 3", u: "https://stream3.rcast.net/60446/" },
                { n: "El Pozo Salsa Club", u: "https://cast4.my-control-panel.com/proxy/elpozosalsa/stream" },
                { n: "Salsa RCast Network", u: "https://stream.rcast.net/60446" },
                { n: "Salsa 106 Panamá", u: "https://azura.panamastreaming.com/listen/salsa_106_radio/radio.mp3" },
                { n: "La Radio SSL Online", u: "https://laradiossl.online:12010/stream" },
                { n: "Salsa Zeno Live HD", u: "https://stream.zenolive.com/tgzmw19rqrquv" },
                { n: "Streaming HD Salsa", u: "https://radiohd2.streaminghd.co:7634/stream" },
                { n: "Conectar Salsa 2032", u: "https://cloudstream2032.conectarhosting.com/8132/stream" },
                { n: "VSG Tech Salsa", u: "https://cloud8.vsgtech.co/8004/stream" },
                { n: "Nexus Salsa Cast", u: "https://ssl.nexuscast.com:9078/stream" },
                { n: "MyRadioStream Salsa", u: "https://s17.myradiostream.com/:4450/listen.mp3" }
            ],
            pop: [
                { n: "Classic Pop Trekant", u: "https://netradio.classicpop.dk/classicpoptrekant" },
                { n: "Pop 31 Stream", u: "http://stream.pop31.com:8100/" },
                { n: "100 BritPop Hits", u: "https://gb25.streamgates.net/radios-audio/100Britpop/icecast.audio" },
                { n: "Live365 Pop Station", u: "https://streaming.live365.com/a57693" },
                { n: "RFM World Radio", u: "https://rfm.lmn.fm/rfm-wr10.mp3" },
                { n: "I Love New Pop", u: "https://play.ilovemusic.de/ilm_ilovenewpop/" },
                { n: "Pure Pop Lion", u: "https://cheetah.streemlion.com/purepopradio" },
                { n: "Zeno Pop Hits", u: "https://stream.zeno.fm/2x2m1q526zmtv" },
                { n: "HitRadio RTL Top 40", u: "https://web.radio.hitradio-rtl.de/hrrtl-top40/stream/mp3" },
                { n: "Only Hits Radio", u: "https://cdn.onlyhitsradio.net/tophits" },
                { n: "Energy 80er Hits", u: "https://edge12.streamonkey.net/energy-80erhits" },
                { n: "AudioVision Pop", u: "http://audiovision.cdnstream1.com/b14981_128mp3" },
                { n: "HotMix Hits France", u: "https://streaming.hotmixradio.com/hotmix-hits-en-mp3" }
            ],
            rock: [
                { n: "Hard Rock Antenne", u: "https://stream.rockantenne.de/rock-antenne-hard-rock/stream/mp3" },
                { n: "Rock 10280 Stream", u: "http://5.9.16.111:10280/stream" },
                { n: "Star FM Christmas", u: "https://stream.starfm.de/xmas/mp3-192/" },
                { n: "Rock Party Feierfreund", u: "https://streams.feierfreund.de/rockparty/mp3-192/" },
                { n: "LandesWelle Rock", u: "https://frontend.streamonkey.net/landeswelle-rockwelle/stream/mp3" },
                { n: "Rockealo Radio King", u: "https://play.radioking.io/rockealo" },
                { n: "80s Rock Antenne", u: "https://stream.rockantenne.de/80er-rock/stream/mp3" },
                { n: "Klassik Radio Rock", u: "https://stream.klassikradio.de/klassikrock/mp3-192/" },
                { n: "Modern Rock Antenne", u: "https://stream.rockantenne.de/modern-rock/stream/mp3" },
                { n: "Live365 Rock Classics", u: "https://streaming.live365.com/a24346" },
                { n: "Star FM Sachsen", u: "http://stream.starfm.de/sachsen/mp3-192/" },
                { n: "Biker Rock Radio", u: "https://stream.rockantenne.de/biker-rock/stream/mp3" },
                { n: "Radio Bob Party", u: "https://streams.radiobob.de/rockparty/mp3-192/" },
                { n: "ABRadio Rock Zabava", u: "http://ice.abradio.cz:8000/rockzabava128.mp3" },
                { n: "Rockabilly Antenne", u: "https://stream.rockantenne.de/rockabilly/stream/mp3" },
                { n: "Rock'n'Roll Antenne", u: "https://stream.rockantenne.de/rockandroll/stream/mp3" },
                { n: "Hemnos Rock Global", u: "https://hemnos.cdnstream.com/1881_128" }
            ]
        };

        const audio = document.getElementById('audio-player');
        const playSvg = document.getElementById('play-svg');
        const stationNameDisp = document.getElementById('current-station-name');
        const genreLabelDisp = document.getElementById('current-genre-label');
        const visualizer = document.getElementById('visualizer');
        const listContainer = document.getElementById('station-list-container');
        const trackCountDisp = document.getElementById('track-count');

        let currentGenre = 'salsa';
        let currentIndex = 0;
        let isShuffle = false;
        let isLoop = false;

        // Crear barras del visualizador dinámicamente
        for(let i=0; i<20; i++) {
            const bar = document.createElement('div');
            bar.className = 'v-bar';
            bar.style.animationDelay = `${i * 0.05}s`;
            visualizer.appendChild(bar);
        }

        // Renderizar la lista de estaciones lateral
        function renderPlaylist() {
            listContainer.innerHTML = '';
            const currentStations = playlist[currentGenre];
            trackCountDisp.innerText = `${currentStations.length} disponibles`;

            currentStations.forEach((station, index) => {
                const li = document.createElement('li');
                li.className = `station-item ${index === currentIndex ? 'active-track' : ''}`;
                li.innerText = `${index + 1}. ${station.n}`;
                li.onclick = () => selectTrack(index);
                listContainer.appendChild(li);
            });
        }

        function loadStation() {
            const station = playlist[currentGenre][currentIndex];
            audio.src = station.u;
            stationNameDisp.innerText = station.n;
            genreLabelDisp.innerText = `${currentGenre} Hits`;
            
            // Actualizar marcador de track activo en el menú lateral
            document.querySelectorAll('.station-item').forEach((item, index) => {
                if(index === currentIndex) item.classList.add('active-track');
                else item.classList.remove('active-track');
            });

            if(!audio.paused || visualizer.classList.contains('playing')) {
                audio.play().catch(() => stopPlayback());
            }
        }

        function selectTrack(index) {
            currentIndex = index;
            loadStation();
            if(audio.paused) togglePlay();
        }

        function togglePlay() {
            if (audio.paused) {
                audio.play().then(() => {
                    visualizer.classList.add('playing');
                    playSvg.innerHTML = '<path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/>';
                }).catch(() => {
                    stopPlayback();
                });
            } else {
                stopPlayback();
            }
        }

        function stopPlayback() {
            audio.pause();
            visualizer.classList.remove('playing');
            playSvg.innerHTML = '<path d="M8 5v14l11-7z"/>';
        }

        function nextStation() {
            const total = playlist[currentGenre].length;
            if (isShuffle) {
                currentIndex = Math.floor(Math.random() * total);
            } else {
                currentIndex = (currentIndex + 1) % total;
            }
            loadStation();
        }

        function prevStation() {
            const total = playlist[currentGenre].length;
            currentIndex = (currentIndex - 1 + total) % total;
            loadStation();
        }

        function changeGenre(genre) {
            currentGenre = genre;
            currentIndex = 0;
            
            // Cambiar estado activo de las pestañas
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            event.target.classList.add('active');
            
            renderPlaylist();
            loadStation();
        }

        function updateVolume() {
            audio.volume = document.getElementById('volume').value;
        }

        function toggleMute() {
            audio.muted = !audio.muted;
            document.getElementById('mute-btn').classList.toggle('active');
            document.getElementById('mute-icon').style.color = audio.muted ? '#ff4a4a' : '';
        }

        function toggleShuffle() {
            isShuffle = !isShuffle;
            document.getElementById('shuffle-btn').classList.toggle('active');
        }

        function toggleLoop() {
            isLoop = !isLoop;
            audio.loop = isLoop;
            document.getElementById('loop-btn').classList.toggle('active');
        }

        // Salto automático de emisora si expira el flujo de datos
        audio.onended = () => {
            if(!isLoop) nextStation();
        };

        // Carga inicial
        renderPlaylist();
        loadStation();
    </script>
</body>
</html>
